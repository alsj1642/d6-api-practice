<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>지하철 빠른하차</title>
<!-- 🔑 인증키는 config.js에 따로 둠 (git에 안 올라감) -->
<script src="config.js"></script>
<script>
  // 🔌 이 화면이 쓰는 API 주소는 전부 여기 한 곳에 모아 둠
  const API = {
    // 🔌 서울교통공사_빠른하차정보 (공공데이터포털, 인증키 필요) — stnNm=역 이름 검색어, numOfRows=최대 개수
    EXIT: "https://apis.data.go.kr/B553766/inout/getFstExit?dataType=JSON&numOfRows=200&stnNm=",
  };
</script>
<style>
  :root {
    --bg: #f2f5f9;
    --card: #ffffff;
    --text: #1f2937;
    --muted: #6b7280;
    --line: #dbe3ec;
    --accent: #1d4ed8;
    --car: #eef2f7;
    --elev: #7c3aed;
    --esc: #0891b2;
    --stair: #ea580c;
    --error-bg: #fef2f2;
    --error-text: #b91c1c;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0e141c;
      --card: #18212c;
      --text: #e5e7eb;
      --muted: #94a3b8;
      --line: #2c3a4a;
      --accent: #7aa2ff;
      --car: #233040;
      --elev: #a78bfa;
      --esc: #22d3ee;
      --stair: #fb923c;
      --error-bg: #3b1d1d;
      --error-text: #fca5a5;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 24px 16px 40px;
    background: var(--bg);
    color: var(--text);
    font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    line-height: 1.5;
  }
  main { max-width: 600px; margin: 0 auto; }
  h1 { font-size: 1.4rem; margin: 0 0 4px; }
  .lead { color: var(--muted); margin: 0 0 16px; font-size: 0.95rem; }
  button { font: inherit; cursor: pointer; }

  /* 검색 */
  form { display: flex; gap: 8px; }
  form input {
    flex: 1; min-width: 0;
    font: inherit; font-size: 1.1rem;
    padding: 12px 14px; border-radius: 12px;
    border: 1px solid var(--line); background: var(--card); color: var(--text);
  }
  form button {
    padding: 12px 18px; border-radius: 12px; border: 0;
    background: var(--accent); color: #fff; font-weight: 600;
  }
  .station-head {
    display: flex; flex-wrap: wrap; align-items: center; gap: 8px;
    margin: 20px 0 0; padding-bottom: 12px; border-bottom: 2px solid var(--line);
  }
  .station-head h2 { font-size: 1.8rem; margin: 0 4px 0 0; }
  .line-badge {
    padding: 2px 10px; border-radius: 999px;
    background: var(--lc); color: #fff; font-size: 0.85rem; font-weight: 700;
  }
  .similar { margin: 10px 0 0; font-size: 0.9rem; color: var(--muted); }
  .similar button {
    margin: 4px 4px 0 0; padding: 4px 12px; border-radius: 999px;
    border: 1px solid var(--line); background: var(--card); color: var(--text);
  }

  /* 탭·필터 칩 */
  .bar { display: flex; flex-wrap: wrap; gap: 6px; margin: 16px 0 12px; }
  .chip {
    padding: 6px 14px; border-radius: 999px;
    border: 1px solid var(--line); background: var(--card); color: var(--text);
  }
  .chip.on { background: var(--text); color: var(--card); border-color: var(--text); }
  .line-tab { font-weight: 700; }
  .line-tab.on { background: var(--lc); border-color: var(--lc); color: #fff; }

  /* 방면 카드 */
  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 18px;
    margin-bottom: 12px;
  }
  .card h2 { font-size: 1.1rem; margin: 0 0 2px; }
  .card .sub { color: var(--muted); font-size: 0.85rem; margin: 0 0 12px; }

  /* 열차 그림: 칸마다 문 4개 */
  .train { display: flex; gap: 3px; overflow-x: auto; padding-bottom: 4px; }
  .car {
    flex: 1 0 34px; background: var(--car); border-radius: 6px;
    padding: 4px 3px 3px; text-align: center;
  }
  .car-no { font-size: 0.7rem; color: var(--muted); line-height: 1.2; }
  .doors { display: flex; gap: 2px; margin-top: 3px; }
  .doors i { flex: 1; height: 10px; border-radius: 2px; background: var(--line); }
  .doors i.elev { background: var(--elev); }
  .doors i.esc { background: var(--esc); }
  .doors i.stair { background: var(--stair); }
  .train-dir { display: flex; justify-content: space-between; font-size: 0.75rem; color: var(--muted); margin: 2px 0 12px; }

  /* 칸-문 목록 */
  ul { list-style: none; margin: 0; padding: 0; }
  li { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-top: 1px solid var(--line); }
  .door {
    flex: none; min-width: 68px; text-align: center;
    font-weight: 800; font-size: 1.25rem; letter-spacing: 0.02em;
    border-radius: 10px; padding: 4px 8px; color: #fff;
  }
  .door.elev { background: var(--elev); }
  .door.esc { background: var(--esc); }
  .door.stair { background: var(--stair); }
  .fac strong { display: block; }
  .fac small { color: var(--muted); }

  .legend { display: flex; flex-wrap: wrap; gap: 12px; font-size: 0.8rem; color: var(--muted); margin-bottom: 12px; }
  .legend span::before {
    content: ""; display: inline-block; width: 10px; height: 10px; border-radius: 2px;
    margin-right: 4px; vertical-align: -1px; background: var(--c);
  }
  .date { color: var(--muted); font-size: 0.85rem; margin-top: 4px; }

  .error {
    background: var(--error-bg); color: var(--error-text);
    border-radius: 12px; padding: 16px;
  }
  .error button {
    margin-top: 8px; padding: 6px 14px; border-radius: 8px;
    border: 1px solid currentColor; background: transparent; color: inherit;
  }
  .source { margin-top: 12px; font-size: 0.85rem; color: var(--muted); text-align: center; }
  .source a { color: var(--accent); }
  .api-box {
    margin-top: 24px; padding: 16px;
    border: 1px dashed var(--line); border-radius: 12px;
    font-size: 0.85rem; background: var(--card);
  }
  .api-box h2 { font-size: 1rem; margin: 0 0 8px; }
  .api-box code { display: block; word-break: break-all; color: var(--muted); margin-bottom: 8px; }
  .api-box a { color: var(--accent); }
</style>
</head>
<body>
<main>
  <h1>🚇 지하철 빠른하차</h1>
  <p class="lead">내릴 역을 넣으면 계단·에스컬레이터·엘리베이터와 가장 가까운 칸-문 번호를 알려 줘요.</p>

  <form id="search">
    <input id="station" value="잠실" placeholder="역 이름 (예: 잠실, 서울역)" aria-label="역 이름">
    <button type="submit">찾기</button>
  </form>

  <div id="result"><p>⏳ 빠른하차 정보를 불러오는 중…</p></div>

  <p class="source">
    데이터 출처: <a href="https://www.data.go.kr/data/15143840/openapi.do" target="_blank" rel="noopener">서울교통공사_빠른하차정보</a> (공공데이터포털)
    · 서울교통공사 구간(1~8호선 등)만 있어요
  </p>

  <section class="api-box">
    <h2>🔌 이 화면이 쓰는 API</h2>
    <code id="api-url"></code>
    <a id="api-link" target="_blank" rel="noopener">새 탭에서 원본 JSON 보기 ↗</a>
    <p><small>🔑 화면에는 키를 가렸지만, 링크와 F12 → Network 탭에서는 키가 보여요. 이 화면은 내 컴퓨터에서만 쓰세요.</small></p>
  </section>
</main>

<script>
  const stationInput = document.getElementById("station");
  const result = document.getElementById("result");

  // 호선 색 (서울 지하철 노선색)
  const LINE_COLOR = {
    "1호선": "#0052A4", "2호선": "#00A84D", "3호선": "#EF7C1C", "4호선": "#00A5DE",
    "5호선": "#996CAC", "6호선": "#CD7C2F", "7호선": "#747F00", "8호선": "#E6186C", "9호선": "#BDB092",
  };
  // 호선별 열차 칸 수 (모르면 데이터에서 가장 큰 칸 번호를 씀)
  const CAR_COUNT = { "1호선": 10, "2호선": 10, "3호선": 10, "4호선": 10, "5호선": 8, "6호선": 8, "7호선": 8, "8호선": 6 };
  const FAC = {
    "엘리베이터": { cls: "elev", icon: "🛗" },
    "에스컬레이터": { cls: "esc", icon: "↗️" },
    "계단": { cls: "stair", icon: "🪜" },
  };

  // 지금 화면 상태: 받은 데이터, 고른 호선, 고른 설비
  const state = { name: "", items: [], line: "", fac: "전체" };

  // API에서 온 글자를 화면에 그대로 넣지 않도록 바꿔 줌
  function esc(s) {
    return String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  }

  function showApi(url) {
    document.getElementById("api-url").textContent = url.replace(/serviceKey=[^&]*/, "serviceKey=🔑(숨김)");
    document.getElementById("api-link").href = url;
  }

  async function getJson(url) {
    const res = await fetch(url); // 🔌 API 호출
    if (!res.ok) throw new Error("응답 코드 " + res.status);
    const data = await res.json();
    const header = data.response?.header;
    if (!header) throw new Error(data.OpenAPI_ServiceResponse?.cmmMsgHeader?.returnAuthMsg || "응답 모양이 달라요");
    if (header.resultCode !== "00") throw new Error(header.resultMsg);
    return data.response.body;
  }

  function errorHtml(title, message) {
    return `
      <div class="card error">
        <strong>⚠️ ${title}</strong><br>
        ${message}<br>
        <button onclick="loadExit()">다시 시도</button>
      </div>
    `;
  }

  function formatDate(ymd) {
    return ymd ? `${ymd.slice(0, 4)}-${ymd.slice(4, 6)}-${ymd.slice(6, 8)}` : "알 수 없음";
  }

  function doorKey(no) {
    const [car, door] = String(no).split("-").map(Number);
    return { car, door };
  }

  async function loadExit(nameArg) {
    if (nameArg) stationInput.value = nameArg;
    const name = stationInput.value.trim().replace(/역$/, "");
    if (!name) return;
    if (typeof CONFIG === "undefined" || !CONFIG.SERVICE_KEY || CONFIG.SERVICE_KEY.includes("여기에")) {
      result.innerHTML = errorHtml("인증키가 없어요.", "같은 폴더의 config.js에 공공데이터포털 인증키를 넣고 저장해 주세요.");
      return;
    }
    // 역 이름(사용자 입력)과 키는 주소 뒤에 붙임
    const url = API.EXIT + encodeURIComponent(name) + "&serviceKey=" + encodeURIComponent(CONFIG.SERVICE_KEY);
    showApi(url);
    result.innerHTML = "<p>⏳ 빠른하차 정보를 불러오는 중…</p>";

    try {
      const body = await getJson(url);
      const all = body.items?.item || [];
      // API는 "잠실"로 찾으면 잠실나루·잠실새내도 주므로, 이름이 정확히 같은 역만 남김
      // ("서울역"처럼 이름 자체에 "역"이 붙은 역도 있어서 두 가지로 비교)
      const names = [name, name + "역"];
      const seen = new Set();
      const exact = all.filter(it => {
        const k = [it.lineNm, it.stnNm, it.upbdnbSe, it.qckgffVhclDoorNo, it.plfmCmgFac].join("|");
        if (!names.includes(it.stnNm) || seen.has(k)) return false;
        seen.add(k);
        return true;
      });
      const similar = [...new Set(all.map(it => it.stnNm))].filter(n => !names.includes(n));

      state.name = exact[0]?.stnNm.replace(/역$/, "") || name;
      state.items = exact;
      state.similar = similar;
      state.line = [...new Set(exact.map(it => it.lineNm))].sort()[0] || "";
      state.fac = "전체";
      render();
    } catch (err) {
      result.innerHTML = errorHtml("빠른하차 정보를 불러오지 못했어요.",
        `인터넷 연결이나 config.js의 키, 맨 위 🔌 주소를 확인해 주세요.<br><small>(${esc(err.message)})</small>`);
    }
  }

  function similarHtml(prefix) {
    if (state.similar.length === 0) return "";
    return `<p class="similar">${prefix}
      ${state.similar.map(n => `<button data-go="${esc(n)}">${esc(n)}</button>`).join("")}
    </p>`;
  }

  function render() {
    if (state.items.length === 0) {
      result.innerHTML = `<div class="card">🔍 "${esc(state.name)}"역의 빠른하차 정보가 없어요.
        ${similarHtml("혹시 이 역인가요?") || "<br>역 이름을 확인해 주세요. (서울교통공사 구간만 있어요)"}</div>`;
      return;
    }

    const lines = [...new Set(state.items.map(it => it.lineNm))].sort();
    const inLine = state.items.filter(it => it.lineNm === state.line);
    const shown = inLine.filter(it => state.fac === "전체" || it.plfmCmgFac === state.fac);

    // 방면별로 묶기
    const dirs = {};
    for (const it of shown) (dirs[it.drtnInfo + "|" + it.upbdnbSe] ||= []).push(it);

    const maxCar = Math.max(CAR_COUNT[state.line] || 0, ...inLine.map(it => doorKey(it.qckgffVhclDoorNo).car || 0));
    const facs = ["전체", ...Object.keys(FAC).filter(f => inLine.some(it => it.plfmCmgFac === f))];

    result.innerHTML = `
      <div class="station-head">
        <h2>${esc(state.name)}역</h2>
        ${lines.map(l => `<span class="line-badge" style="--lc:${LINE_COLOR[l] || "var(--accent)"}">${esc(l)}</span>`).join("")}
      </div>
      ${similarHtml("비슷한 이름의 역:")}
      ${lines.length > 1 ? `<div class="bar">
        ${lines.map(l => `<button class="chip line-tab ${l === state.line ? "on" : ""}" style="--lc:${LINE_COLOR[l] || "var(--accent)"}" data-line="${esc(l)}">${esc(l)}</button>`).join("")}
      </div>` : ""}
      <div class="bar">
        ${facs.map(f => `<button class="chip ${f === state.fac ? "on" : ""}" data-fac="${esc(f)}">${FAC[f]?.icon || "✨"} ${esc(f)}</button>`).join("")}
      </div>
      <div class="legend">
        <span style="--c:var(--elev)">엘리베이터</span>
        <span style="--c:var(--esc)">에스컬레이터</span>
        <span style="--c:var(--stair)">계단</span>
      </div>
      ${Object.entries(dirs).map(([key, list]) => dirCard(key, list, maxCar)).join("")
        || `<div class="card">이 호선에는 고른 설비 정보가 없어요.</div>`}
      <p class="date">기준 날짜: ${formatDate(inLine[0]?.crtrYmd)} · "2-3"은 2번째 칸 3번 문이에요</p>
    `;
  }

  function dirCard(key, list, maxCar) {
    const [toward, updown] = key.split("|");
    list.sort((a, b) => a.qckgffVhclDoorNo.localeCompare(b.qckgffVhclDoorNo, "ko", { numeric: true }));

    // 칸·문 번호 → 설비 색
    const mark = {};
    for (const it of list) mark[it.qckgffVhclDoorNo] = FAC[it.plfmCmgFac]?.cls || "";

    const cars = Array.from({ length: maxCar }, (_, i) => i + 1).map(car => `
      <div class="car">
        <div class="car-no">${car}</div>
        <div class="doors">${[1, 2, 3, 4].map(d => `<i class="${mark[car + "-" + d] || ""}"></i>`).join("")}</div>
      </div>`).join("");

    return `
      <section class="card">
        <h2>➡️ ${esc(toward)} 방면</h2>
        <p class="sub">${esc(state.line)} ${esc(state.name)}역 · ${esc(updown)}</p>
        <div class="train">${cars}</div>
        <div class="train-dir"><span>1칸</span><span>${maxCar}칸</span></div>
        <ul>
          ${list.map(it => {
            const f = FAC[it.plfmCmgFac] || { cls: "", icon: "🚪" };
            return `<li>
              <span class="door ${f.cls}">${esc(it.qckgffVhclDoorNo)}</span>
              <span class="fac"><strong>${f.icon} ${esc(it.plfmCmgFac)}</strong>
                ${it.fwkPstnNm ? `<small>${esc(it.fwkPstnNm)}</small>` : ""}</span>
            </li>`;
          }).join("")}
        </ul>
      </section>
    `;
  }

  // 호선 탭, 설비 칩, 비슷한 역 버튼 클릭
  result.addEventListener("click", e => {
    const b = e.target.closest("button");
    if (!b) return;
    if (b.dataset.go) loadExit(b.dataset.go);
    else if (b.dataset.line) { state.line = b.dataset.line; state.fac = "전체"; render(); }
    else if (b.dataset.fac) { state.fac = b.dataset.fac; render(); }
  });

  document.getElementById("search").addEventListener("submit", e => {
    e.preventDefault();
    loadExit();
  });
  loadExit();
</script>
</body>
</html>
