<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>우리 동네 날씨</title>
<script>
  // 🔌 이 화면이 쓰는 API 주소는 전부 여기 한 곳에 모아 둠
  const PLACE = "서울 (시청)"; // 화면에 보일 동네 이름 — latitude/longitude를 바꾸면 이것도 같이 바꿔 주세요
  const API = {
    // 🔌 Open-Meteo 예보 API (키 없음) — latitude=위도, longitude=경도 숫자를 바꾸면 다른 도시 날씨가 와요
    weather: "https://api.open-meteo.com/v1/forecast?latitude=37.5665&longitude=126.9780&current=temperature_2m,apparent_temperature,relative_humidity_2m,wind_speed_10m,weather_code&timezone=Asia%2FSeoul",
  };
</script>
<style>
  :root {
    --bg: #eef4fb;
    --card: #ffffff;
    --text: #1f2937;
    --muted: #6b7280;
    --line: #dbe3ee;
    --accent: #2563eb;
    --error-bg: #fef2f2;
    --error-text: #b91c1c;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --text: #e5e7eb;
      --muted: #94a3b8;
      --line: #334155;
      --accent: #60a5fa;
      --error-bg: #3b1d1d;
      --error-text: #fca5a5;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 24px 16px 40px;
    background: var(--bg);
    color: var(--text);
    font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    line-height: 1.5;
  }
  main { max-width: 480px; margin: 0 auto; }
  h1 { font-size: 1.4rem; margin: 0 0 16px; }
  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 24px;
    text-align: center;
  }
  .place { color: var(--muted); font-size: 0.95rem; }
  .emoji { font-size: 4.5rem; line-height: 1.1; margin: 8px 0; }
  .temp { font-size: 3rem; font-weight: 700; }
  .desc { font-size: 1.3rem; margin-bottom: 12px; }
  .extra {
    display: flex; justify-content: center; gap: 16px; flex-wrap: wrap;
    color: var(--muted); font-size: 0.9rem;
  }
  .time { margin-top: 12px; font-size: 0.85rem; color: var(--muted); }
  .error {
    background: var(--error-bg); color: var(--error-text);
    border-radius: 12px; padding: 16px; text-align: left;
  }
  .error button {
    margin-top: 8px; padding: 6px 14px; border-radius: 8px;
    border: 1px solid currentColor; background: transparent; color: inherit; cursor: pointer;
  }
  .source { margin-top: 12px; font-size: 0.85rem; color: var(--muted); text-align: center; }
  .source a { color: var(--accent); }
  .api-box {
    margin-top: 24px; padding: 16px;
    border: 1px dashed var(--line); border-radius: 12px;
    font-size: 0.85rem; background: var(--card);
  }
  .api-box h2 { font-size: 1rem; margin: 0 0 8px; }
  .api-box code { display: block; word-break: break-all; color: var(--muted); margin-bottom: 8px; }
  .api-box a { color: var(--accent); }
</style>
</head>
<body>
<main>
  <h1>🏠 우리 동네 날씨</h1>

  <section class="card" id="weather-card">
    <p>⏳ 날씨를 불러오는 중…</p>
  </section>

  <p class="source">Weather data by <a href="https://open-meteo.com/" target="_blank" rel="noopener">Open-Meteo.com</a></p>

  <section class="api-box">
    <h2>🔌 이 화면이 쓰는 API</h2>
    <code id="api-url"></code>
    <a id="api-link" target="_blank" rel="noopener">새 탭에서 원본 JSON 보기 ↗</a>
  </section>
</main>

<script>
  // WMO 날씨 코드(숫자) → 한국어 + 이모지
  const WEATHER_CODES = {
    0: ["맑음", "☀️"],
    1: ["대체로 맑음", "🌤️"],
    2: ["구름 조금", "⛅"],
    3: ["흐림", "☁️"],
    45: ["안개", "🌫️"],
    48: ["서리 안개", "🌫️"],
    51: ["약한 이슬비", "🌦️"],
    53: ["이슬비", "🌦️"],
    55: ["강한 이슬비", "🌧️"],
    56: ["약한 어는 이슬비", "🌧️"],
    57: ["강한 어는 이슬비", "🌧️"],
    61: ["약한 비", "🌦️"],
    63: ["비", "🌧️"],
    65: ["강한 비", "🌧️"],
    66: ["약한 어는 비", "🌧️"],
    67: ["강한 어는 비", "🌧️"],
    71: ["약한 눈", "🌨️"],
    73: ["눈", "❄️"],
    75: ["강한 눈", "❄️"],
    77: ["싸락눈", "🌨️"],
    80: ["약한 소나기", "🌦️"],
    81: ["소나기", "🌧️"],
    82: ["강한 소나기", "⛈️"],
    85: ["약한 눈 소나기", "🌨️"],
    86: ["강한 눈 소나기", "❄️"],
    95: ["뇌우", "⛈️"],
    96: ["우박을 동반한 뇌우", "⛈️"],
    99: ["강한 우박 뇌우", "⛈️"],
  };

  const card = document.getElementById("weather-card");

  // API 상자: 실제로 부르는 주소와 원본 JSON 링크
  document.getElementById("api-url").textContent = API.weather;
  document.getElementById("api-link").href = API.weather;

  async function loadWeather() {
    card.innerHTML = "<p>⏳ 날씨를 불러오는 중…</p>";
    try {
      const res = await fetch(API.weather); // 🔌 API 호출
      if (!res.ok) throw new Error("응답 코드 " + res.status);
      const data = await res.json();
      const now = data.current;
      if (!now || now.temperature_2m === undefined) throw new Error("응답에 current 값이 없어요");

      const [desc, emoji] = WEATHER_CODES[now.weather_code] || ["알 수 없는 날씨 (코드 " + now.weather_code + ")", "❔"];

      card.innerHTML = `
        <div class="place">📍 ${PLACE}</div>
        <div class="emoji">${emoji}</div>
        <div class="temp">${Math.round(now.temperature_2m)}°C</div>
        <div class="desc">${desc}</div>
        <div class="extra">
          <span>체감 ${Math.round(now.apparent_temperature)}°C</span>
          <span>습도 ${now.relative_humidity_2m}%</span>
          <span>바람 ${now.wind_speed_10m} km/h</span>
        </div>
        <div class="time">기준 시각: ${now.time.replace("T", " ")} (한국 시간, 15분 단위 관측·예보 값)</div>
      `;
    } catch (err) {
      card.innerHTML = `
        <div class="error">
          <strong>⚠️ 날씨를 불러오지 못했어요.</strong><br>
          인터넷 연결이나 맨 아래 🔌 주소를 확인해 주세요.<br>
          <small>(${err.message})</small><br>
          <button onclick="loadWeather()">다시 시도</button>
        </div>
      `;
    }
  }

  loadWeather();
</script>
</body>
</html>
